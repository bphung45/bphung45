# Runs every 5mins on weekdays during market hours (ET = UTC-5).
name: Update S&P 500 Chart

on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"  # every 5 min, Mon–Fri, 9:30–4pm ET (13:30–20:00 UTC)
  workflow_dispatch:

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate chart
        run: python generate_chart.py

      - name: Commit & push updated chart
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/sp500.png
          git diff --cached --quiet || git commit -m "chore: update S&P 500 chart [skip ci]"
          git push