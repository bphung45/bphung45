# Runs every hour on weekdays during market hours (ET = UTC-5).
# Also runs at weekend close so the chart stays current by Monday.
# Can be triggered manually via workflow_dispatch.

name: Update S&P 500 Chart

on:
  schedule:
    # Every hour Mon–Fri between 9am–5pm ET (14:00–22:00 UTC)
    - cron: "0 14-22 * * 1-5"
    # Saturday morning cleanup run
    - cron: "0 10 * * 6"
  workflow_dispatch:   # allow manual trigger from Actions tab

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated image back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate chart
        run: python generate_chart.py

      - name: Commit & push updated chart
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/sp500.png
          # Only commit if the image actually changed
          git diff --cached --quiet || git commit -m "chore: update S&P 500 chart [skip ci]"
          git push
